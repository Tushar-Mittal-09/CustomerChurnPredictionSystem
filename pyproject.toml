[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard-ai"
version = "1.0.0"
description = "Production Customer Churn Prediction and Retention Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ChurnGuard AI Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "catboost>=1.2.0",
    "optuna>=3.2.0",
    "shap>=0.42.0",
    "joblib>=1.3.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
